name: Device tests

# Runs the library's ohosTest suite on a HarmonyOS emulator and fails on any test failure or error.
#
# Targets:
#   hosted-windows  EXPERIMENTAL. GitHub-hosted windows-2025 runner. Emulator from the Command Line Tools,
#                   x86_64 phone image from Huawei's CDN, Mesa llvmpipe as the OpenGL driver. Huawei does not
#                   support the emulator inside a virtual machine or without a GPU, so boot may fail; the
#                   job logs the hypervisor state and the emulator console to show why.
#   hosted-linux    EXPERIMENTAL. GitHub-hosted ubuntu-24.04 runner with KVM. The Linux emulator also needs
#                   a render node under /dev/dri, which the job tries to provide with vgem and Mesa.
#   hosted-both     Both hosted targets above, side by side.
#   self-hosted     A runner labelled hos-emulator with DevEco Studio installed and an emulator instance.
#
# Triggers: a manual run (pick the target), or a pull request labelled "device-tests" (every pull request
# when the repository variable HOS_DEVICE_TESTS_ON_PR is 'true'). Pull requests run on the target in the
# repository variable HOS_DEVICE_TESTS_TARGET (default hosted-both). Pull requests from forks never run
# on the self-hosted runner.
#
# Optional repository variables:
#   HOS_HOSTED_EMULATOR_REQUIRED   'true' makes a failing hosted job fail the workflow (default: it does not)
#   HOS_SELF_HOSTED_DEVECO_HOME    DevEco Studio on the self-hosted runner (default: DEVECO_HOME on the runner)
#   HOS_SELF_HOSTED_EMULATOR       emulator instance to boot there when none is running

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to run the suite
        type: choice
        options: [hosted-both, hosted-windows, hosted-linux, self-hosted]
        default: hosted-both
      software_gl:
        description: Hosted Windows only, give the emulator Mesa llvmpipe as its OpenGL driver
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  plan:
    name: Pick the target
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'device-tests') ||
      vars.HOS_DEVICE_TESTS_ON_PR == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target: ${{ steps.pick.outputs.target }}
      hosted: ${{ steps.pick.outputs.hosted }}
    steps:
      - name: Pick the target
        id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          INPUT_TARGET: ${{ inputs.target }}
          PR_TARGET: ${{ vars.HOS_DEVICE_TESTS_TARGET }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          target=none
          if [ "$EVENT" = workflow_dispatch ]; then
            target="$INPUT_TARGET"
          elif [ "$ACTION" = labeled ] && [ "$ADDED_LABEL" != device-tests ]; then
            echo "Another label was added; nothing to run."
          else
            target="${PR_TARGET:-hosted-both}"
          fi
          if [ "$EVENT" = pull_request ] && [ "$target" = self-hosted ] && [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::notice::Pull requests from forks do not run on the self-hosted runner."
            target=none
          fi
          case "$target" in
            none | hosted-windows | hosted-linux | hosted-both | self-hosted) ;;
            *) echo "::error::Unknown target '$target' (HOS_DEVICE_TESTS_TARGET)"; exit 1 ;;
          esac
          case "$target" in
            hosted-windows) hosted='["hosted-windows"]' ;;
            hosted-linux) hosted='["hosted-linux"]' ;;
            hosted-both) hosted='["hosted-linux","hosted-windows"]' ;;
            *) hosted='[]' ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "hosted=$hosted" >> "$GITHUB_OUTPUT"
          echo "Device tests target: \`$target\`" >> "$GITHUB_STEP_SUMMARY"

  hosted:
    name: Emulator on ${{ matrix.target }} (experimental)
    needs: plan
    if: needs.plan.outputs.hosted != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.hosted) }}
    runs-on: ${{ matrix.target == 'hosted-linux' && 'ubuntu-24.04' || 'windows-2025' }}
    continue-on-error: ${{ vars.HOS_HOSTED_EMULATOR_REQUIRED != 'true' }}
    timeout-minutes: 90
    concurrency:
      group: device-tests-${{ matrix.target }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      HOS_CLT_VERSION: ${{ vars.HOS_CLT_VERSION }}
      HOS_CLT_URL_LINUX_X64: ${{ vars.HOS_CLT_URL_LINUX_X64 }}
      HOS_CLT_SHA256_LINUX_X64: ${{ vars.HOS_CLT_SHA256_LINUX_X64 }}
      HOS_CLT_URL_WINDOWS_X64: ${{ vars.HOS_CLT_URL_WINDOWS_X64 }}
      HOS_CLT_SHA256_WINDOWS_X64: ${{ vars.HOS_CLT_SHA256_WINDOWS_X64 }}
      HOS_EMULATOR_CREATE: 'true'
      HOS_EMULATOR_HEADLESS: 'true'
      HOS_BOOT_TIMEOUT: '1200'
      HOS_SOFTWARE_GL: ${{ github.event_name == 'workflow_dispatch' && !inputs.software_gl && 'false' || 'true' }}
      MSYS_NO_PATHCONV: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose working folders
        run: |
          # On Windows the temp drive has the room for the toolchain, the image and the instance.
          if [ "$RUNNER_OS" = Windows ]; then
            echo "HOS_CLT_HOME=$(cygpath -m "$RUNNER_TEMP")/hos-clt" >> "$GITHUB_ENV"
          fi
          echo "HOS_EMULATOR_HOME=$(if [ "$RUNNER_OS" = Windows ]; then cygpath -m "$RUNNER_TEMP"; else echo "$RUNNER_TEMP"; fi)/hos-emulator" >> "$GITHUB_ENV"
          df -h . "$RUNNER_TEMP" 2>/dev/null || true

      - name: Free disk space and install libGL
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
          ldconfig -p | grep 'libGL\.so\.1' > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libgl1; }

      - name: Resolve toolchain settings
        id: config
        run: bash .github/scripts/hos-ci.sh config

      # Linux shares the PR checks cache; the Windows toolchain is too large to be worth caching.
      - name: Restore Command Line Tools
        id: clt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.config.outputs.clt_home }}
          key: ${{ steps.config.outputs.clt_cache_key }}

      - name: Set up Command Line Tools
        env:
          HOS_CLT_AUTH_HEADER: ${{ secrets.HOS_CLT_AUTH_HEADER }}
        run: bash .github/scripts/hos-ci.sh install-toolchain

      - name: Save Command Line Tools
        if: runner.os == 'Linux' && steps.clt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.config.outputs.clt_home }}
          key: ${{ steps.config.outputs.clt_cache_key }}

      - name: Align the hvigor plugin with the toolchain
        run: bash .github/scripts/hos-ci.sh align-plugin

      - name: Install ohpm dependencies
        run: ohpm install --all

      - name: Compile ohosTest HAP
        run: hvigorw --mode module -p module=library@ohosTest -p isOhosTest=true -p product=default -p buildMode=test genOnDeviceTestHap --no-daemon --stacktrace

      - name: Prepare the runner for the emulator
        run: bash .github/scripts/emulator.sh prepare-host

      - name: Download the system image
        run: bash .github/scripts/emulator.sh fetch-image

      - name: Boot the emulator and run the tests
        run: bash .github/scripts/emulator.sh run-tests library/build/default/outputs/ohosTest/library-ohosTest-unsigned.hap ci-out/device-tests

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests-${{ matrix.target }}
          path: ci-out/device-tests/
          if-no-files-found: warn
          retention-days: 14

  self-hosted:
    name: Emulator on the self-hosted runner
    needs: plan
    if: >-
      needs.plan.outputs.target == 'self-hosted' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, hos-emulator]
    timeout-minutes: 45
    # One emulator per machine: queue runs instead of letting two jobs drive it at once.
    concurrency:
      group: hos-self-hosted-emulator
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      HOS_DEVECO_HOME_VAR: ${{ vars.HOS_SELF_HOSTED_DEVECO_HOME }}
      HOS_EMULATOR_NAME: ${{ vars.HOS_SELF_HOSTED_EMULATOR }}
      HOS_EMULATOR_REUSE: 'true'
      HOS_BOOT_TIMEOUT: '600'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the local DevEco Studio
        run: bash .github/scripts/hos-ci.sh use-toolchain "${HOS_DEVECO_HOME_VAR:-${DEVECO_HOME:-}}"

      - name: Align the hvigor plugin with the toolchain
        run: bash .github/scripts/hos-ci.sh align-plugin

      - name: Install ohpm dependencies
        run: ohpm install --all

      - name: Compile ohosTest HAP
        run: hvigorw --mode module -p module=library@ohosTest -p isOhosTest=true -p product=default -p buildMode=test genOnDeviceTestHap --no-daemon --stacktrace

      - name: Run the tests on the emulator
        run: bash .github/scripts/emulator.sh run-tests library/build/default/outputs/ohosTest/library-ohosTest-unsigned.hap ci-out/device-tests

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests-self-hosted
          path: ci-out/device-tests/
          if-no-files-found: warn
          retention-days: 14
