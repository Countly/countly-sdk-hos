name: Public API changes

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Breaking changes
    outputs:
      report: ${{ steps.report.outputs.report }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      HOS_CLT_VERSION: ${{ vars.HOS_CLT_VERSION }}
      HOS_CLT_URL_LINUX_X64: ${{ vars.HOS_CLT_URL_LINUX_X64 }}
      HOS_CLT_SHA256_LINUX_X64: ${{ vars.HOS_CLT_SHA256_LINUX_X64 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # hvigor needs libGL for texture compression on Linux (Huawei's pipeline guide).
      - name: Install libGL
        run: ldconfig -p | grep 'libGL\.so\.1' > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libgl1; }

      - name: Resolve toolchain settings
        id: config
        run: bash .github/scripts/hos-ci.sh config

      - name: Restore Command Line Tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.config.outputs.clt_home }}
          key: ${{ steps.config.outputs.clt_cache_key }}

      - name: Set up Command Line Tools
        env:
          HOS_CLT_AUTH_HEADER: ${{ secrets.HOS_CLT_AUTH_HEADER }}
        run: bash .github/scripts/hos-ci.sh install-toolchain

      # The first parent of the pull request's merge commit is the base branch it merges into.
      - name: Build the release HAR of the base branch and of this pull request
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          for tree in "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE"; do
            (cd "$tree" \
              && bash "$GITHUB_WORKSPACE/.github/scripts/hos-ci.sh" align-plugin \
              && ohpm install --all \
              && hvigorw --mode module -p module=library@default -p product=default -p buildMode=release assembleHar --no-daemon)
          done

      - name: Compare the public API with the base branch
        id: compare
        run: |
          har=library/build/default/outputs/default/library.har
          python3 .github/scripts/public_api.py "$RUNNER_TEMP/base/$har" | LC_ALL=C sort > "$RUNNER_TEMP/base.txt"
          python3 .github/scripts/public_api.py "$har" | LC_ALL=C sort > "$RUNNER_TEMP/head.txt"
          LC_ALL=C comm -23 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" | sed 's/^/Removed or changed: /' > "$RUNNER_TEMP/breaking.txt"
          LC_ALL=C comm -13 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" > "$RUNNER_TEMP/added.txt"

      - name: Report the public API changes
        id: report
        run: bash .github/scripts/public_api_report.sh "$RUNNER_TEMP/breaking.txt" "$RUNNER_TEMP/added.txt"

      - name: Upload the CI report fragment
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-public-api
          path: ${{ runner.temp }}/ci-report-public-api
          if-no-files-found: ignore

      - name: Require a CHANGELOG entry for breaking changes
        run: |
          if [ ! -s "$RUNNER_TEMP/breaking.txt" ]; then
            exit 0
          fi
          if git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
            echo "::error title=Breaking API change::This pull request breaks the public API without a CHANGELOG.md entry. The job summary lists each break."
            exit 1
          fi
          echo "::warning title=Breaking API change::This pull request breaks the public API. Check that CHANGELOG.md marks it as a breaking change."

      # The committed record keeps every change to the public API visible in the pull request's diff.
      - name: Compare the public API with its record
        id: record
        if: ${{ !cancelled() && steps.compare.outcome == 'success' }}
        run: >
          bash .github/scripts/public_api_record.sh
          "$RUNNER_TEMP/head.txt=api/countly-sdk-hos.api"

      - name: Upload the new record
        if: ${{ !cancelled() && steps.record.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-api-record
          path: ${{ runner.temp }}/public-api-record

  comment:
    name: Comment the public API changes
    needs: api
    # A fork's or Dependabot's pull request only gets a read-only token, so its report stays in the job summary.
    if: >-
      always() && needs.api.outputs.report != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ needs.api.outputs.report }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- countly-public-api -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f "body=$REPORT" > /dev/null
          elif ! grep -qx 'No public API change.' <<< "$REPORT"; then
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f "body=$REPORT" > /dev/null
          fi
