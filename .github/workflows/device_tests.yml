name: Device tests (HarmonyOS)

# Runs the library's ohosTest suite on a HarmonyOS emulator, fails on any test failure or error, and reports the
# suite's line, function and branch coverage.
#
# Every pull request and every push to staging or master runs it on a GitHub-hosted ubuntu-24.04 runner
# with KVM: the emulator comes from the Command Line Tools and the x86_64 phone image from Huawei's CDN.

on:
  pull_request:
  push:
    branches: [staging, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: HarmonyOS emulator test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: device-tests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      HOS_CLT_VERSION: ${{ vars.HOS_CLT_VERSION }}
      HOS_CLT_URL_LINUX_X64: ${{ vars.HOS_CLT_URL_LINUX_X64 }}
      HOS_CLT_SHA256_LINUX_X64: ${{ vars.HOS_CLT_SHA256_LINUX_X64 }}
      HOS_EMULATOR_HEADLESS: 'true'
      HOS_BOOT_TIMEOUT: '600'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space and install libGL
        run: |
          echo "HOS_EMULATOR_HOME=$RUNNER_TEMP/hos-emulator" >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
          ldconfig -p | grep 'libGL\.so\.1' > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libgl1; }

      - name: Resolve toolchain settings
        id: config
        run: bash .github/scripts/hos-ci.sh config

      # Shares the Command Line Tools cache with the build workflow.
      - name: Restore Command Line Tools
        id: clt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.config.outputs.clt_home }}
          key: ${{ steps.config.outputs.clt_cache_key }}

      - name: Set up Command Line Tools
        env:
          HOS_CLT_AUTH_HEADER: ${{ secrets.HOS_CLT_AUTH_HEADER }}
        run: bash .github/scripts/hos-ci.sh install-toolchain

      - name: Save Command Line Tools
        if: steps.clt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.config.outputs.clt_home }}
          key: ${{ steps.config.outputs.clt_cache_key }}

      - name: Align the hvigor plugin with the toolchain
        run: bash .github/scripts/hos-ci.sh align-plugin

      - name: Install ohpm dependencies
        run: ohpm install --all

      # The instrumented build also writes init_coverage.json, the map the coverage report starts from.
      - name: Compile ohosTest HAP
        run: hvigorw --mode module -p module=library@ohosTest -p isOhosTest=true -p product=default -p buildMode=test -p ohos-test-coverage=true genOnDeviceTestHap --no-daemon --stacktrace

      - name: Prepare the runner for the emulator
        run: bash .github/scripts/emulator.sh prepare-host

      - name: Download the system image
        run: bash .github/scripts/emulator.sh fetch-image

      - name: Boot the emulator and run the tests
        env:
          HOS_TEST_COVERAGE: 'true'
        run: bash .github/scripts/emulator.sh run-tests library/build/default/outputs/ohosTest/library-ohosTest-unsigned.hap ci-out/device-tests

      # The emulator cannot read the repository, so the request scenarios print their records into the aa test log.
      - name: Compare the request records
        id: requests
        if: ${{ !cancelled() && hashFiles('ci-out/device-tests/aa-test.log') != '' }}
        run: python3 .github/scripts/request_records.py ci-out/device-tests/aa-test.log api/requests "$RUNNER_TEMP/request-records"

      - name: Upload the new request records
        if: ${{ !cancelled() && steps.requests.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: request-records
          path: ${{ runner.temp }}/request-records

      # collectCoverage only logs a missing input file, so both are checked first.
      - name: Write the coverage report
        run: |
          data=library/.test/default/intermediates/ohosTest
          for file in "$data/init_coverage.json" "$data/coverage_data/js_coverage.json"; do
            if [ ! -s "$file" ]; then
              echo "::error title=Coverage::$file is missing"
              exit 1
            fi
          done
          hvigorw collectCoverage -p "projectPath=$PWD" -p "reportPath=$PWD/ci-out/device-tests/coverage" \
            -p "coverageFile=$PWD/$data/coverage_data/js_coverage.json#$PWD/$data/init_coverage.json" --no-daemon
          python3 .github/scripts/coverage_summary.py ci-out/device-tests/coverage/coverageReport.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests
          path: ci-out/device-tests/
          if-no-files-found: warn
          retention-days: 14
