name: Device tests (HarmonyOS)

# Runs the library's ohosTest suite on a HarmonyOS emulator and fails on any test failure or error.
#
# Every pull request and every push to staging or master runs it on a GitHub-hosted ubuntu-24.04 runner
# with KVM: the emulator comes from the Command Line Tools and the x86_64 phone image from Huawei's CDN.
# A manual run can use a self-hosted runner labelled hos-emulator instead, with DevEco Studio and an
# emulator instance on it.
#
# Optional repository variables for the self-hosted runner:
#   HOS_SELF_HOSTED_DEVECO_HOME    DevEco Studio on the runner (default: DEVECO_HOME on the runner)
#   HOS_SELF_HOSTED_EMULATOR       emulator instance to boot there when none is running

on:
  pull_request:
  push:
    branches: [staging, master]
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run the suite
        type: choice
        options: [hosted, self-hosted]
        default: hosted

permissions:
  contents: read

jobs:
  emulator:
    name: HarmonyOS emulator test
    if: github.event_name != 'workflow_dispatch' || inputs.runner == 'hosted'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: device-tests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      HOS_CLT_VERSION: ${{ vars.HOS_CLT_VERSION }}
      HOS_CLT_URL_LINUX_X64: ${{ vars.HOS_CLT_URL_LINUX_X64 }}
      HOS_CLT_SHA256_LINUX_X64: ${{ vars.HOS_CLT_SHA256_LINUX_X64 }}
      HOS_EMULATOR_CREATE: 'true'
      HOS_EMULATOR_HEADLESS: 'true'
      HOS_BOOT_TIMEOUT: '1200'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space and install libGL
        run: |
          echo "HOS_EMULATOR_HOME=$RUNNER_TEMP/hos-emulator" >> "$GITHUB_ENV"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
          ldconfig -p | grep 'libGL\.so\.1' > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libgl1; }

      - name: Resolve toolchain settings
        id: config
        run: bash .github/scripts/hos-ci.sh config

      # Shares the Command Line Tools cache with the build workflow.
      - name: Restore Command Line Tools
        id: clt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.config.outputs.clt_home }}
          key: ${{ steps.config.outputs.clt_cache_key }}

      - name: Set up Command Line Tools
        env:
          HOS_CLT_AUTH_HEADER: ${{ secrets.HOS_CLT_AUTH_HEADER }}
        run: bash .github/scripts/hos-ci.sh install-toolchain

      - name: Save Command Line Tools
        if: steps.clt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.config.outputs.clt_home }}
          key: ${{ steps.config.outputs.clt_cache_key }}

      - name: Align the hvigor plugin with the toolchain
        run: bash .github/scripts/hos-ci.sh align-plugin

      - name: Install ohpm dependencies
        run: ohpm install --all

      - name: Compile ohosTest HAP
        run: hvigorw --mode module -p module=library@ohosTest -p isOhosTest=true -p product=default -p buildMode=test genOnDeviceTestHap --no-daemon --stacktrace

      - name: Prepare the runner for the emulator
        run: bash .github/scripts/emulator.sh prepare-host

      - name: Download the system image
        run: bash .github/scripts/emulator.sh fetch-image

      - name: Boot the emulator and run the tests
        run: bash .github/scripts/emulator.sh run-tests library/build/default/outputs/ohosTest/library-ohosTest-unsigned.hap ci-out/device-tests

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests
          path: ci-out/device-tests/
          if-no-files-found: warn
          retention-days: 14

  self-hosted:
    name: HarmonyOS emulator test (self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted'
    runs-on: [self-hosted, hos-emulator]
    timeout-minutes: 45
    # One emulator per machine: queue runs instead of letting two jobs drive it at once.
    concurrency:
      group: hos-self-hosted-emulator
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      HOS_DEVECO_HOME_VAR: ${{ vars.HOS_SELF_HOSTED_DEVECO_HOME }}
      HOS_EMULATOR_NAME: ${{ vars.HOS_SELF_HOSTED_EMULATOR }}
      HOS_EMULATOR_REUSE: 'true'
      HOS_BOOT_TIMEOUT: '600'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the local DevEco Studio
        run: bash .github/scripts/hos-ci.sh use-toolchain "${HOS_DEVECO_HOME_VAR:-${DEVECO_HOME:-}}"

      - name: Align the hvigor plugin with the toolchain
        run: bash .github/scripts/hos-ci.sh align-plugin

      - name: Install ohpm dependencies
        run: ohpm install --all

      - name: Compile ohosTest HAP
        run: hvigorw --mode module -p module=library@ohosTest -p isOhosTest=true -p product=default -p buildMode=test genOnDeviceTestHap --no-daemon --stacktrace

      - name: Run the tests on the emulator
        run: bash .github/scripts/emulator.sh run-tests library/build/default/outputs/ohosTest/library-ohosTest-unsigned.hap ci-out/device-tests

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-tests-self-hosted
          path: ci-out/device-tests/
          if-no-files-found: warn
          retention-days: 14
